<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmartJanja - TMG Platform</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
<link rel="icon" type="image/jpg" href="smart.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0e3b5c;
  font-family: 'Poppins', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* =========================================================
   1. INTRO ANIMATION STAGE
========================================================== */
#intro-stage {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: radial-gradient(ellipse at 50% 30%, #1a5c8a 0%, #12456b 50%, #0e3b5c 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  perspective: 1500px;
  animation: introVanish 2.5s ease-in-out 11.5s forwards;
  pointer-events: none;
}

@keyframes introVanish {
  0% { opacity: 1; transform: scale(1); filter: blur(0px); }
  30% { opacity: 0.8; transform: scale(1.02); filter: blur(2px); }
  60% { opacity: 0.4; transform: scale(1.05); filter: blur(8px); }
  100% { opacity: 0; transform: scale(1.15); filter: blur(20px); pointer-events: none; }
}

/* ===== CRYSTAL SHARDS - FAST APPEAR ===== */
.crystal {
  position: absolute;
  background: linear-gradient(135deg, rgba(100,170,210,0.12) 0%, rgba(80,120,180,0.06) 50%, rgba(60,90,140,0.04) 100%);
  border: 1px solid rgba(130,180,210,0.12);
  backdrop-filter: blur(3px);
  box-shadow: 0 0 50px rgba(100,160,200,0.06), inset 0 0 20px rgba(120,170,210,0.04);
  clip-path: polygon(50% 0%, 100% 25%, 85% 100%, 15% 100%, 0% 25%);
  opacity: 0;
  transform: scale(0) rotate(var(--r, 0deg));
  animation: crystalFastAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
             crystalFloatSlow linear infinite;
}

.crystal:nth-child(1)  { --r: 15deg;  width: 100px; height: 170px; left: 8%;  top: 12%;  animation-delay: 0.0s, 1s;   animation-duration: 0.6s, 20s; }
.crystal:nth-child(2)  { --r: -20deg; width: 70px;  height: 120px; left: 20%; top: 65%;  animation-delay: 0.05s, 1.2s; animation-duration: 0.6s, 25s; }
.crystal:nth-child(3)  { --r: 30deg;  width: 130px; height: 220px; left: 72%; top: 8%;   animation-delay: 0.08s, 0.8s; animation-duration: 0.6s, 22s; }
.crystal:nth-child(4)  { --r: -10deg; width: 90px;  height: 150px; left: 82%; top: 55%;  animation-delay: 0.1s, 1.5s;  animation-duration: 0.6s, 28s; }
.crystal:nth-child(5)  { --r: 45deg;  width: 60px;  height: 100px; left: 48%; top: 78%;  animation-delay: 0.12s, 1s;   animation-duration: 0.6s, 18s; }
.crystal:nth-child(6)  { --r: -35deg; width: 120px; height: 200px; left: 28%; top: 25%;  animation-delay: 0.06s, 1.3s; animation-duration: 0.6s, 24s; }
.crystal:nth-child(7)  { --r: 20deg;  width: 80px;  height: 130px; left: 58%; top: 18%;  animation-delay: 0.09s, 0.9s; animation-duration: 0.6s, 26s; }
.crystal:nth-child(8)  { --r: -25deg; width: 110px; height: 180px; left: 88%; top: 80%;  animation-delay: 0.11s, 1.1s; animation-duration: 0.6s, 21s; }
.crystal:nth-child(9)  { --r: 10deg;  width: 50px;  height: 85px;  left: 42%; top: 42%;  animation-delay: 0.07s, 1.4s; animation-duration: 0.6s, 23s; opacity: 0.5; }
.crystal:nth-child(10) { --r: -15deg; width: 140px; height: 230px; left: 5%;  top: 70%;  animation-delay: 0.03s, 0.7s; animation-duration: 0.6s, 27s; }
.crystal:nth-child(11) { --r: 35deg;  width: 75px;  height: 125px; left: 68%; top: 68%;  animation-delay: 0.04s, 1.2s; animation-duration: 0.6s, 19s; }
.crystal:nth-child(12) { --r: -40deg; width: 55px;  height: 90px;  left: 35%; top: 5%;   animation-delay: 0.13s, 1.6s; animation-duration: 0.6s, 30s; }

@keyframes crystalFastAppear {
  0% { opacity: 0; transform: scale(0) rotate(var(--r)) translateZ(-300px); }
  60% { opacity: 1; transform: scale(1.1) rotate(var(--r)) translateZ(50px); }
  100% { opacity: 1; transform: scale(1) rotate(var(--r)) translateZ(0); }
}
@keyframes crystalFloatSlow {
  0%, 100% { transform: translateY(0px) rotate(var(--r)); }
  50% { transform: translateY(-20px) rotate(var(--r)); }
}

/* ===== LOGO ===== */
.logo-container {
  position: relative;
  width: 260px; height: 260px;
  transform-style: preserve-3d;
  opacity: 0;
  animation: logoEnter 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards,
             logoMelt 2.5s ease-in-out 4.5s forwards,
             logoDissolve 2s ease-in-out 6.5s forwards,
             logoFold 2s ease-in-out 8.5s forwards;
}

@keyframes logoEnter {
  0% { opacity: 0; transform: rotateX(-80deg) rotateY(120deg) scale(0.2) translateZ(-400px); }
  60% { opacity: 1; transform: rotateX(5deg) rotateY(-10deg) scale(1.05) translateZ(50px); }
  100% { opacity: 1; transform: rotateX(0) rotateY(0) scale(1) translateZ(0); }
}
@keyframes logoMelt {
  0% { filter: blur(0px) brightness(1); transform: scale(1); }
  50% { filter: blur(3px) brightness(1.2); transform: scale(1.05) translateY(10px); }
  100% { filter: blur(6px) brightness(1.5); transform: scale(1.1) translateY(30px); opacity: 0.7; }
}
@keyframes logoDissolve {
  0% { opacity: 0.7; filter: blur(6px); }
  30% { opacity: 0.5; filter: blur(10px) saturate(2); transform: scale(1.15) translateY(50px) rotateX(10deg); }
  60% { opacity: 0.25; filter: blur(15px) saturate(3); transform: scale(1.2) translateY(80px) rotateX(20deg); }
  100% { opacity: 0; filter: blur(25px) saturate(4); transform: scale(1.3) translateY(120px) rotateX(45deg); }
}
@keyframes logoFold {
  0% { opacity: 0; transform: scale(1.3) translateY(120px) rotateX(45deg); }
  50% { opacity: 0.15; transform: scale(0.8) translateY(60px) rotateX(-30deg) rotateY(30deg); }
  100% { opacity: 0; transform: scale(0.2) translateY(0) rotateX(-90deg) rotateY(90deg); }
}

.logo-hex {
  position: absolute; inset: 0;
  clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
  background: linear-gradient(135deg, rgba(80,130,180,0.15) 0%, rgba(60,90,140,0.08) 50%, rgba(80,120,180,0.10) 100%);
  border: 2px solid rgba(130,180,210,0.20);
  backdrop-filter: blur(15px);
  box-shadow: 0 0 60px rgba(100,160,200,0.15), inset 0 0 40px rgba(120,170,210,0.06), 0 20px 40px rgba(0,0,0,0.3);
  animation: hexGlow 2.5s ease-in-out infinite;
}
.logo-hex::before {
  content: '';
  position: absolute; inset: 10px;
  clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
  background: linear-gradient(180deg, rgba(120,170,210,0.08) 0%, transparent 50%, rgba(60,90,140,0.06) 100%);
  border: 1px solid rgba(140,190,220,0.12);
}
@keyframes hexGlow {
  0%, 100% { box-shadow: 0 0 60px rgba(100,160,200,0.15), inset 0 0 40px rgba(120,170,210,0.06), 0 20px 40px rgba(0,0,0,0.3); }
  50% { box-shadow: 0 0 90px rgba(120,170,210,0.25), inset 0 0 60px rgba(130,180,220,0.08), 0 20px 40px rgba(0,0,0,0.3); }
}
.logo-inner {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 130px; height: 130px;
  clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
  background: linear-gradient(135deg, rgba(100,160,200,0.18) 0%, rgba(60,90,140,0.10) 100%);
  border: 1px solid rgba(140,190,220,0.25);
  box-shadow: inset 0 0 30px rgba(120,170,210,0.15), 0 0 40px rgba(100,160,200,0.20);
  display: flex; align-items: center; justify-content: center;
}
.logo-text {
  font-size: 52px; font-weight: 900;
  background: linear-gradient(180deg, #a0d0e0 0%, #2aa8e0 50%, #0a5a8f 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 40px rgba(120,170,210,0.35);
  animation: letterPop 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s forwards;
  transform: scale(0);
}
@keyframes letterPop {
  0% { transform: scale(0) rotateY(180deg); }
  60% { transform: scale(1.15) rotateY(0deg); }
  100% { transform: scale(1); }
}

/* ===== INTRO TEXT GROUP ===== */
.text-group {
  margin-top: 50px;
  text-align: center;
  display: flex; flex-direction: column;
  align-items: center;
  animation: textGroupMelt 3s ease-in-out 5s forwards;
}
.brand-title {
  font-size: 48px; font-weight: 800;
  letter-spacing: 8px;
  background: linear-gradient(90deg, #a0d0e0 0%, #2aa8e0 30%, #1a7fc4 70%, #88b0c0 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 60px rgba(100,160,200,0.20);
  opacity: 0;
  animation: textReveal 1s ease-out 2s forwards;
  position: relative;
}
@keyframes textReveal {
  0% { opacity: 0; transform: translateY(40px); filter: blur(10px); letter-spacing: 20px; }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); letter-spacing: 8px; }
}
.from-text {
  margin-top: 18px;
  font-size: 14px; font-weight: 300;
  letter-spacing: 6px; text-transform: uppercase;
  color: rgba(140,190,220,0.40);
  opacity: 0;
  animation: fadeSlideUp 0.8s ease-out 2.6s forwards;
}
.tmg-text {
  margin-top: 8px;
  font-size: 28px; font-weight: 700;
  letter-spacing: 4px;
  background: linear-gradient(90deg, #88aacc 0%, #2aa8e0 50%, #336699 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  opacity: 0;
  animation: fadeSlideUp 0.8s ease-out 3s forwards;
}
@keyframes fadeSlideUp {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes textGroupMelt {
  0% { filter: blur(0); opacity: 1; transform: translateY(0); }
  40% { filter: blur(2px); opacity: 0.8; transform: translateY(15px); }
  70% { filter: blur(6px); opacity: 0.4; transform: translateY(40px) scaleY(0.9); }
  100% { filter: blur(12px); opacity: 0; transform: translateY(80px) scaleY(0.5); }
}

/* ===== LIQUID DROPLETS ===== */
.liquid-overlay {
  position: absolute; inset: 0;
  z-index: 50;
  pointer-events: none;
  opacity: 0;
  animation: liquidShow 2.5s ease-in-out 6.5s forwards;
}
.drop {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(140,190,220,0.60) 0%, rgba(100,160,200,0.30) 50%, transparent 70%);
  box-shadow: 0 0 20px rgba(120,170,210,0.45);
  animation: dropFall linear forwards;
}
@keyframes liquidShow {
  0% { opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; }
}
@keyframes dropFall {
  0% { transform: translateY(-100px) scale(0); opacity: 0; }
  20% { transform: translateY(0) scale(1); opacity: 1; }
  80% { transform: translateY(300px) scale(0.8); opacity: 0.6; }
  100% { transform: translateY(500px) scale(0); opacity: 0; }
}

/* ===== PAPER CURL & TRANSPARENCY WIPE ===== */
.paper-curl {
  position: absolute; inset: 0;
  z-index: 60;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(180deg, transparent 0%, rgba(14,59,92,0.8) 40%, #0e3b5c 100%);
  animation: curlShow 2s ease-in-out 8.5s forwards;
}
.curl-line {
  position: absolute; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, rgba(120,170,210,0.45), transparent);
  box-shadow: 0 0 20px rgba(120,170,210,0.35);
  animation: curlMove 2s ease-in-out 8.5s forwards;
}
@keyframes curlShow { 0% { opacity: 0; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
@keyframes curlMove { 0% { top: 100%; opacity: 1; } 100% { top: 0%; opacity: 0; } }

.transparency-wipe {
  position: absolute; inset: 0;
  z-index: 70;
  pointer-events: none;
  background: linear-gradient(0deg, #0e3b5c 0%, transparent 50%, #0e3b5c 100%);
  background-size: 100% 200%; background-position: 0 100%;
  opacity: 0;
  animation: wipeUp 2s ease-in-out 9.5s forwards;
}
@keyframes wipeUp { 0% { opacity: 0; background-position: 0 100%; } 50% { opacity: 1; } 100% { opacity: 1; background-position: 0 0; } }

/* =========================================================
   2. MAIN APP STAGE (Login/Signup Form)
========================================================== */
#main-stage {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  animation: mainAppear 1.5s ease-out 12s forwards;
  background: radial-gradient(ellipse at 30% 20%, #1a5c8a 0%, #12456b 60%, #0e3b5c 100%);
  padding: 20px;
  overflow-y: auto;
}

@keyframes mainAppear {
  0% { opacity: 0; transform: scale(1.05); filter: blur(10px); }
  100% { opacity: 1; transform: scale(1); filter: blur(0); pointer-events: all; }
}

/* Floating crystals in background */
.bg-crystal {
  position: absolute;
  background: linear-gradient(135deg, rgba(100,160,200,0.05) 0%, rgba(60,90,140,0.03) 100%);
  border: 1px solid rgba(130,180,210,0.05);
  clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
  animation: bgCrystalFloat linear infinite;
}
.bg-crystal:nth-child(1) { width: 80px; height: 130px; left: 10%; top: 15%; animation-duration: 20s; }
.bg-crystal:nth-child(2) { width: 60px; height: 100px; left: 80%; top: 20%; animation-duration: 25s; }
.bg-crystal:nth-child(3) { width: 100px; height: 160px; left: 85%; top: 70%; animation-duration: 22s; }
.bg-crystal:nth-child(4) { width: 50px; height: 85px; left: 15%; top: 75%; animation-duration: 28s; }
.bg-crystal:nth-child(5) { width: 70px; height: 120px; left: 50%; top: 85%; animation-duration: 24s; }
@keyframes bgCrystalFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-15px) rotate(5deg); }
}

/* Particles */
.particle {
  position: absolute;
  border-radius: 50%;
  background: rgba(130,180,210,0.35);
  box-shadow: 0 0 10px rgba(120,170,210,0.60);
  animation: particleRise linear infinite;
}
@keyframes particleRise {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* Scan lines */
.scan-lines {
  position: fixed; inset: 0; z-index: 99;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
}

/* ===== GLASSMORPHISM CARD ===== */
.auth-container {
  position: relative;
  z-index: 10;
  background: rgba(18, 30, 48, 0.5);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(130, 180, 210, 0.12);
  padding: 45px 35px;
  border-radius: 28px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 60px rgba(100, 160, 200, 0.08);
  width: 100%;
  max-width: 420px;
  text-align: center;
  color: #ffffff;
  animation: cardSlideUp 0.8s ease-out 12.3s forwards;
  opacity: 0;
  transform: translateY(30px);
}

@keyframes cardSlideUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}

.logo-img {
  max-width: 85px;
  margin-bottom: 10px;
  animation: float 4s ease-in-out infinite;
  filter: drop-shadow(0 0 15px rgba(120, 170, 210, 0.30));
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0px); }
}

.auth-container h1 {
  color: #ffffff;
  margin-top: 0;
  margin-bottom: 30px;
  font-size: 1.8em;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  background: linear-gradient(180deg, #a0d0e0 0%, #2aa8e0 50%, #1a7fc4 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ===== TABS ===== */
.auth-tabs {
  display: flex;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 14px;
  padding: 5px;
  margin-bottom: 35px;
  position: relative;
  border: 1px solid rgba(130, 180, 210, 0.08);
}

.auth-tab {
  flex: 1;
  padding: 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95em;
  color: rgba(140, 190, 220, 0.40);
  border-radius: 10px;
  transition: all 0.3s ease;
  letter-spacing: 0.5px;
  text-align: center;
}

.auth-tab.active {
  background: linear-gradient(135deg, rgba(100, 160, 200, 0.18) 0%, rgba(60, 90, 140, 0.12) 100%);
  color: #ffffff;
  box-shadow: 0 0 20px rgba(100, 160, 200, 0.15), 0 4px 10px rgba(0,0,0,0.1);
  border: 1px solid rgba(130, 180, 210, 0.15);
}

.auth-form {
  display: none;
  text-align: left;
  animation: fadeIn 0.5s ease-in-out;
}

.auth-form.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

/* ===== INPUT FIELDS ===== */
.form-group {
  position: relative;
  margin-bottom: 22px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-size: 0.85em;
  font-weight: 500;
  color: rgba(140, 190, 220, 0.85);
  letter-spacing: 0.5px;
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.input-wrapper i.icon-left {
  position: absolute;
  left: 15px;
  color: rgba(130, 180, 210, 0.55);
  font-size: 1.1em;
  transition: color 0.3s;
}

.form-group input {
  width: 100%;
  padding: 15px 15px 15px 45px;
  background: rgba(40, 60, 80, 0.15);
  border: 1px solid rgba(130, 180, 210, 0.12);
  border-radius: 14px;
  color: #ffffff;
  font-size: 0.95em;
  font-family: inherit;
  box-sizing: border-box;
  transition: all 0.3s ease;
}

.form-group input::placeholder {
  color: rgba(130, 180, 210, 0.35);
}

.form-group input:focus {
  outline: none;
  background: rgba(50, 70, 100, 0.25);
  border-color: #2aa8e0;
  box-shadow: 0 0 15px rgba(120, 170, 210, 0.15), inset 0 0 10px rgba(100, 160, 200, 0.04);
}

.form-group input:focus + i.icon-left,
.input-wrapper:focus-within i.icon-left {
  color: #2aa8e0;
}

.password-toggle {
  position: absolute;
  right: 15px;
  cursor: pointer;
  color: rgba(130, 180, 210, 0.45);
  transition: color 0.3s;
}
.password-toggle:hover { color: #ffffff; }

/* ===== SUBMIT BUTTON ===== */
.btn-submit {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #2aa8e0 0%, #1a7fc4 100%);
  color: #fff;
  font-size: 1.05em;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 30px -5px rgba(100, 160, 200, 0.30);
  margin-top: 10px;
  position: relative;
  overflow: hidden;
}

.btn-submit::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s;
}

.btn-submit:hover::before {
  transform: translateX(100%);
}

.btn-submit:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px -5px rgba(120, 170, 210, 0.40);
  background: linear-gradient(135deg, #2aa8e0 0%, #1a7fc4 100%);
}

.btn-submit:active {
  transform: translateY(0);
  box-shadow: 0 5px 15px -5px rgba(100, 160, 200, 0.25);
}

.para {
  font-weight: 400;
  color: rgba(140, 190, 220, 0.55);
  font-size: 0.85em;
  margin-top: 25px;
  letter-spacing: 0.5px;
}
.para i {
  color: #2aa8e0;
  margin-right: 5px;
}

/* Custom Alert */
.custom-alert {
  display: none;
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #ff9999;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 0.85em;
  text-align: center;
  animation: fadeIn 0.3s;
  backdrop-filter: blur(10px);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .auth-container { padding: 35px 25px; border-radius: 20px; }
  .auth-container h1 { font-size: 1.5em; }
  .brand-title { font-size: 32px; letter-spacing: 4px; }
  .tmg-text { font-size: 20px; }
  .logo-container { width: 200px; height: 200px; }
  .logo-text { font-size: 40px; }
  .btn-submit { font-size: 0.95em; }
}
</style>
</head>
<body>

<!-- ==========================================================
     INTRO ANIMATION SEQUENCE (SPLASH SCREEN)
========================================================== -->
<div id="intro-stage">
  <!-- Crystal Shards -->
  <div class="crystal"></div><div class="crystal"></div><div class="crystal"></div>
  <div class="crystal"></div><div class="crystal"></div><div class="crystal"></div>
  <div class="crystal"></div><div class="crystal"></div><div class="crystal"></div>
  <div class="crystal"></div><div class="crystal"></div><div class="crystal"></div>

  <!-- Logo -->
  <div class="logo-container">
    <div class="logo-hex"></div>
    <div class="logo-inner">
      <div class="logo-text">SJ</div>
    </div>
  </div>

  <!-- Text Group -->
  <div class="text-group">
    <div class="brand-title">SmartJanja</div>
    <div class="from-text">from</div>
    <div class="tmg-text">TMG Platform</div>
  </div>

  <!-- Liquid Droplets Overlay -->
  <div class="liquid-overlay" id="liquidOverlay"></div>

  <!-- Paper Curl Effect -->
  <div class="paper-curl">
    <div class="curl-line"></div>
  </div>

  <!-- Transparency Wipe -->
  <div class="transparency-wipe"></div>
</div>

<!-- ==========================================================
     MAIN LOGIN/SIGNUP STAGE
========================================================== -->
<div id="main-stage">

  <!-- Background Floating Crystals -->
  <div class="bg-crystal"></div>
  <div class="bg-crystal"></div>
  <div class="bg-crystal"></div>
  <div class="bg-crystal"></div>
  <div class="bg-crystal"></div>

  <!-- Particles Container -->
  <div id="particlesContainer"></div>

  <!-- Login Card -->
  <div class="auth-container" id="authContainer">
    <img src="smart.png" alt="SmartJanja Logo" class="logo-img">
    <h1>SmartJanja</h1>

    <div class="auth-tabs">
      <span class="auth-tab active" id="signup-tab">Jisajili</span>
      <span class="auth-tab" id="login-tab">Ingia Ndani</span>
    </div>

    <div id="alertBox" class="custom-alert"></div>

    <div id="signup-form" class="auth-form active">
      <form id="admin-signup-form">
        <div class="form-group">
          <label for="owner-fullname">Jina Kamili</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user icon-left"></i>
            <input type="text" id="owner-fullname" placeholder="Mfano: Juma Omary" required />
          </div>
        </div>
        <div class="form-group">
          <label for="phone-number">Namba ya Simu</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone icon-left"></i>
            <input type="tel" id="phone-number" placeholder="Mfano: 0712345678" required>
          </div>
        </div>
        <div class="form-group">
          <label for="admin-password">Neno la Siri (Password)</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock icon-left"></i>
            <input type="password" id="admin-password" placeholder="Tengeneza neno la siri" required />
            <span class="password-toggle" onclick="togglePasswordVisibility('admin-password')"><i class="fa-solid fa-eye"></i></span>
          </div>
        </div>
        <button type="submit" class="btn-submit">Jisajili Sasa</button>
      </form>
    </div>

    <div id="login-form" class="auth-form">
      <form id="login-admin-form">
        <div class="form-group">
          <label for="admin-login-phone">Namba ya Simu</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone icon-left"></i>
            <input type="tel" id="admin-login-phone" placeholder="Ingiza namba yako" required />
          </div>
        </div>
        <div class="form-group">
          <label for="admin-login-password">Neno la Siri</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock icon-left"></i>
            <input type="password" id="admin-login-password" placeholder="Ingiza neno la siri" required />
            <span class="password-toggle" onclick="togglePasswordVisibility('admin-login-password')"><i class="fa-solid fa-eye"></i></span>
          </div>
        </div>
        <button type="submit" class="btn-submit">Ingia Ndani</button>
      </form>
    </div>

    <p class="para"><i class="fa-solid fa-headset"></i> Kwa msaada tupigie/SMS: 0786701705</p>
  </div>
</div>

<!-- Scan Lines Overlay -->
<div class="scan-lines"></div>

<script>
// ==========================================================
//  SUPABASE & AUTH LOGIC (ORIGINAL CODE PRESERVED)
// ==========================================================
const SUPABASE_URL = 'https://dbtqwpwuktyqgnznxthw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRidHF3cHd1a3R5cWduem54dGh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTczMDYwMjcsImV4cCI6MjA3Mjg4MjAyN30.aMbbK6r76HLusW4HfBr3bsGcYXFJHg_Cm-qPdWYh79M';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showPremiumAlert(msg) {
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' + msg;
  alertBox.style.display = 'block';
  setTimeout(function() { alertBox.style.display = 'none'; }, 5000);
}

// Auto-login check
(function() {
  try {
    var bizId = localStorage.getItem('sj_current_biz_id');
    if (bizId) {
      window.location.href = 'msimamizi.html?businessId=' + encodeURIComponent(bizId);
    }
  } catch(e) {}
})();

document.addEventListener('DOMContentLoaded', async function() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    const { data: businessProfile } = await supabaseClient
      .from('business_profiles')
      .select('id')
      .eq('admin_id', session.user.id)
      .single();
    if (businessProfile) {
      localStorage.setItem('sj_current_biz_id', businessProfile.id);
      window.location.href = 'msimamizi.html?businessId=' + businessProfile.id;
    }
  }
});

// Tab switching
const signupTab = document.getElementById('signup-tab');
const loginTab = document.getElementById('login-tab');
const signupForm = document.getElementById('signup-form');
const loginForm = document.getElementById('login-form');

signupTab.addEventListener('click', function() {
  signupTab.classList.add('active');
  loginTab.classList.remove('active');
  signupForm.classList.add('active');
  loginForm.classList.remove('active');
  document.getElementById('alertBox').style.display = 'none';
});

loginTab.addEventListener('click', function() {
  loginTab.classList.add('active');
  signupTab.classList.remove('active');
  loginForm.classList.add('active');
  signupForm.classList.remove('active');
  document.getElementById('alertBox').style.display = 'none';
});

function togglePasswordVisibility(inputId) {
  const inputField = document.getElementById(inputId);
  const icon = inputField.nextElementSibling.querySelector('i');
  if (inputField.type === 'password') {
    inputField.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
  } else {
    inputField.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
  }
}

// Sign up handler
document.getElementById('admin-signup-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const ownerFullName = document.getElementById('owner-fullname').value.trim();
  const phoneNumber = document.getElementById('phone-number').value.trim();
  const adminPassword = document.getElementById('admin-password').value;

  if (adminPassword.length < 6) {
    showPremiumAlert('Neno la siri lazima liwe na angalau herufi 6.');
    return;
  }

  const systemEmail = phoneNumber + '@smartjanja.com';

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: systemEmail,
      password: adminPassword,
    });

    if (error) {
      if (error.message.includes('already registered')) {
        showPremiumAlert('Namba hii ya simu imeshasajiliwa tayari. Tafadhali bofya \'Ingia Ndani\'.');
      } else {
        showPremiumAlert('Hitilafu: ' + error.message);
      }
      return;
    }

    const { error: insertError } = await supabaseClient
      .from('business_profiles')
      .insert({
        owner_fullname: ownerFullName,
        phone_number: phoneNumber,
        admin_id: data.user.id
      });

    if (insertError) {
      showPremiumAlert('Hitilafu kuhifadhi taarifa: ' + insertError.message);
      return;
    }

    const { data: businessProfile, error: fetchError } = await supabaseClient
      .from('business_profiles')
      .select('id')
      .eq('admin_id', data.user.id)
      .single();

    if (fetchError || !businessProfile) {
      showPremiumAlert('Hitilafu kupakua data: ' + (fetchError ? fetchError.message : ''));
      return;
    }

    localStorage.setItem('sj_current_biz_id', businessProfile.id);
    window.location.href = 'msimamizi.html?businessId=' + businessProfile.id;

  } catch (err) {
    showPremiumAlert('Hitilafu isiyojulikana: ' + err.message);
  }
});

// Login handler
document.getElementById('login-admin-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const phoneNumber = document.getElementById('admin-login-phone').value.trim();
  const adminPassword = document.getElementById('admin-login-password').value;
  const systemEmail = phoneNumber + '@smartjanja.com';

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: systemEmail,
      password: adminPassword,
    });

    if (error) {
      showPremiumAlert('Namba ya simu au Neno la siri si sahihi.');
      return;
    }

    const { data: businessProfile, error: fetchError } = await supabaseClient
      .from('business_profiles')
      .select('id')
      .eq('admin_id', data.user.id)
      .single();

    if (fetchError || !businessProfile) {
      showPremiumAlert('Kuna tatizo na akaunti hii. Tafadhali wasiliana na msaada.');
      await supabaseClient.auth.signOut();
      return;
    }

    localStorage.setItem('sj_current_biz_id', businessProfile.id);
    window.location.href = 'msimamizi.html?businessId=' + businessProfile.id;

  } catch (err) {
    showPremiumAlert('Kuna tatizo limetokea: ' + err.message);
  }
});

// ==========================================================
//  ANIMATION HELPERS (Liquid Drops + Particles)
// ==========================================================
(function() {
  // Liquid droplets for intro
  const overlay = document.getElementById('liquidOverlay');
  for (let i = 0; i < 20; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = (Math.random() * 100) + '%';
    d.style.width = d.style.height = (Math.random() * 12 + 6) + 'px';
    d.style.animationDuration = (Math.random() * 0.8 + 0.5) + 's';
    d.style.animationDelay = (Math.random() * 1.5 + 6.5) + 's';
    overlay.appendChild(d);
  }

  // Particles for main stage
  const container = document.getElementById('particlesContainer');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 10 + 8) + 's';
    p.style.animationDelay = (Math.random() * 5 + 12) + 's';
    p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
    container.appendChild(p);
  }
})();

// Remove intro stage from DOM after animation to free memory
setTimeout(function() {
  const intro = document.getElementById('intro-stage');
  if (intro) {
    intro.style.display = 'none';
  }
}, 14500);

// NOTE: Hakuna redirect ya moja kwa moja hapa.
// Mtumiaji anaelekezwa msimamizi.html PALE TU anapomaliza kujisajili
// au kuingia (angalia sign up / login handlers juu).
</script>

</body>
</html>
